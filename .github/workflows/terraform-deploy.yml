name: Terraform Deploy

# Pull request -> terraform plan (preview only)
# Merge to main -> terraform apply (deploys the live site)
on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "backend.hcl"
      - ".terraform.lock.hcl"
      - "site/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "backend.hcl"
      - ".terraform.lock.hcl"
      - "site/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token to sign in to Azure

# Never run two Terraform jobs at once
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  # Azure sign-in through OIDC. No client secret exists anywhere.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Init
        run: terraform init -backend-config=backend.hcl

      - name: Plan
        run: terraform plan -lock-timeout=5m

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Init
        run: terraform init -backend-config=backend.hcl

      - name: Apply
        run: terraform apply -auto-approve -lock-timeout=5m

      # Cloudflare caches the site at its edge, so clear it after every deploy
      # or visitors keep seeing the old files. Needs Zone > Cache Purge on the token.
      - name: Purge Cloudflare cache
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${TF_VAR_cloudflare_zone_id}/purge_cache" \
            -H "Authorization: Bearer ${TF_VAR_cloudflare_api_token}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | jq -e '.success' > /dev/null
          echo "Cloudflare cache purged"
