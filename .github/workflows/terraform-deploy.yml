name: Terraform Deploy

# Pull request -> terraform plan (preview only)
# Merge to main -> terraform apply (deploys the live site)
on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - "site/**"
      - ".github/workflows/terraform-deploy.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - "site/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two Terraform jobs at once. timeout-minutes on each job means a
# hung run can't hold this group (and the state lock) forever.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  # Terraform state in Cloudflare R2. The R2 token can only read and write
  # objects in the state bucket.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -lock-timeout=5m

  apply:
    name: apply
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      - name: Init
        run: terraform init

      # No cache purge step: each deploy uploads a new asset manifest, and
      # Workers serves the changed files without one (tested from outside).
      - name: Apply
        run: terraform apply -auto-approve -lock-timeout=5m
