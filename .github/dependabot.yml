# Keeps the commit-pinned GitHub Actions up to date. Dependabot opens a pull
# request when an action releases a new version, updating both the commit
# hash and the version comment, so pins never go stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release. Malicious releases are
    # usually spotted and pulled within days, so a short delay means never
    # being among the first to run one.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
